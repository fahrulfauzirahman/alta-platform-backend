services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alta
      POSTGRES_PASSWORD: alta
      POSTGRES_DB: alta_platform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment:
      DATABASE_URL: postgres://alta:alta@postgres:5432/alta_platform
      API_ADDR: 0.0.0.0:8080
    ports: ["8080:8080"]
    depends_on: [postgres]
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    environment:
      DATABASE_URL: postgres://alta:alta@postgres:5432/alta_platform
    depends_on: [postgres]
volumes:
  pgdata: {}
